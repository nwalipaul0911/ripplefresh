<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="rippleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1976d2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0e3a6e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="url(#rippleGradient)"/>
  
  <!-- Ripple circles representing water - expanding outward -->
  <circle cx="50" cy="50" r="12" fill="none" stroke="#64b5f6" stroke-width="2" opacity="0.6"/>
  <circle cx="50" cy="50" r="22" fill="none" stroke="#42a5f5" stroke-width="1.5" opacity="0.4"/>
  <circle cx="50" cy="50" r="32" fill="none" stroke="#1976d2" stroke-width="1" opacity="0.2"/>
  
  <!-- Central water droplet shape -->
  <g filter="url(#glow)">
    <path d="M 50 28 C 42 35 38 42 38 48 C 38 57 43.5 64 50 64 C 56.5 64 62 57 62 48 C 62 42 58 35 50 28 Z" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>